apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: hydrofab
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fab-postgres
  namespace: hydrofab
  labels:
    app: fab-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fab-postgres
  template:
    metadata:
      labels:
        app: fab-postgres
    spec:
      containers:
        - name: postgres
          image: fab-postgres:latest
          imagePullPolicy: Never       # use local image built from db/Dockerfile
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: fab-db-config
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: fab-db-config
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fab-db-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "fab", "-d", "hydrofab"]
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: fab-postgres
  namespace: hydrofab
spec:
  selector:
    app: fab-postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
