apiVersion: apps/v1
kind: Deployment
metadata:
  name: fab-api
  namespace: hydrofab
  labels:
    app: fab-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fab-api
  template:
    metadata:
      labels:
        app: fab-api
    spec:
      containers:
        - name: api
          image: fab-api:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          env:
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: fab-db-secret
                  key: CONNECTION_STRING
            - name: ASPNETCORE_URLS
              value: "http://+:5000"
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: fab-api
  namespace: hydrofab
spec:
  selector:
    app: fab-api
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP
